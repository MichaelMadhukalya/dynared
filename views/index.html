<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynamoDB Notebook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="header">DynamoDB Notebook</div>
        <div class="content">
            <div class="left">
                <div class="new-query" id="newQuery">[+] New Query</div>
                <form>
                    <textarea class="editor" id="editor" placeholder="Enter command..."></textarea>
                    <div class="button-container">
                        <button type="button" class="run-btn" id="runBtn">Run</button>
                    </div>
                </form>
            </div>
            <div class="divider"></div>
            <div class="right">
                <div class="output-title">Output</div>
                <div class="spinner" id="spinner"></div>
                <div class="output" id="output"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
